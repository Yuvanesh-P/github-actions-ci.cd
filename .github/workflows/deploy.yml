
name: TaskFlow CI Pipeline

on:
  push:
    branches:
      - dev
      - qa
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

  deploy-dev:
    name: Dev Deployment
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Confirm Dev stage
        run: echo "Dev checks passed. Actual Azure deployment will be configured later."

  deploy-qa:
    name: QA Deployment
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Confirm QA stage
        run: echo "QA checks passed. Actual Azure deployment will be configured later."

  deploy-prod:
    name: Production Deployment
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Confirm Production stage
        run: echo "Production checks passed. Actual Azure deployment will be configured later."
